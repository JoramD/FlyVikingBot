services:
  bot:
    build: .
    image: joramd/flyviking-bot
    container_name: flyviking-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - flyviking-bot

networks:
  # This compose file owns the network. The website's cron container (it sends the IPS webhooks)
  # joins it as an *external* network, so IPS can POST to
  # http://flyviking-bot:8080/ips/<secret>/<event> without public exposure.
  # Start this stack before the website's, so the network exists.
  flyviking-bot:
    name: ${DOCKER_NETWORK:-flyviking-bot}
