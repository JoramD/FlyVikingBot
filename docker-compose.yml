services:
  bot:
    build: .
    image: joramd/flyviking-bot
    container_name: flyviking-bot
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - flyviking

networks:
  # Shared with the website's cron container (it sends the IPS webhooks) so IPS can POST to
  # http://flyviking-bot:8080/ips/<secret>/<event> without public exposure.
  # Create once with: docker network create flyviking
  flyviking:
    name: ${DOCKER_NETWORK:-flyviking}
    external: true
