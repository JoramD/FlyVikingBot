[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flyvikingbot"
version = "2.0.0"
description = "Discord bot for the FlyViking virtual airline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",
    "aiohttp>=3.11,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
include = ["flyvikingbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
